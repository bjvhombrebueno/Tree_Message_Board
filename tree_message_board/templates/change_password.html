{% extends 'layout.html' %}

{% block title %}Change Password{% endblock %}

{% block content %}

<form action="{{url_for('password')}}" method="post" novalidate>
	<div class="container text-center">
		<div class = "row justify-content-center">
			<div class="col-auto">
				<label for="username" class="form-label">Username: </label><br>
				<input type="text" class="form-control" name="username" {% if account %} value="{{account['username']}}" {% endif %} readonly />
				<div class="invalid-feedback">
					Please enter valid username
				</div>  
				<!-- Get the passwords from the form -->
				<label for="password" class="form-label"> Old Password: </label><br>
				<input type="password" class="form-control" name="oldpassword"  required  />
				<div class="invalid-feedback">
					Please enter valid password
				</div>  
				<label for="password" class="form-label"> New Password: </label><br>
				<input type="password" class="form-control" name="newpassword"  required  />
				<div class="invalid-feedback">
					Please enter valid password
				</div>  
				<br>
				<input class="btn btn-secondary" type="submit" value="Update password"/>
			</div>
		</div>
	</div>
</form>
{% endblock  %}
