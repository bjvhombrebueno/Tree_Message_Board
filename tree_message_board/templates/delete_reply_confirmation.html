{% extends "layout.html" %}

{% block content %}
<!-- Asks for post deletion confirmation -->
<form action='/delete_reply_confirmation/{{replydata['reply_id']}}' method="POST" class="row needs-validation">
    <div class="container text-center">
        <div class = "row justify-content-center">
            <h2 class="text-center text-white">Delete Reply</h2>
            <br>
            <br>
            <div class="col-auto">
                
                <h5 class="text-center text-white">Delete this reply?</h5>
                <p class="text-center text-white">{{replydata['content']}}</p>
                <p class="text-center text-white">{{replydata['username']}}</p>
                <p class="text-center text-white">{{replydata['created_at']}}</p>
                <br>
                <input class="btn btn-secondary" type="submit" name="delete" value="Delete"/>
            </div>
        </div>
    </div>
</form>    

{% endblock %}
