{% extends "layout.html" %}

{% block content %}

<h2 class="text-center">View Post</h2>

{{messagedata}}
{{replydata}}
<br>
    <form action='/view_post/{{messageid}}' method="POST" class="row needs-validation">
    
            <div class="container text-center">
                <div class = "row justify-content-center">
                    <input type = "hidden" name = "messagedata" value="{{messagedata}}"/>
                    <input type = "hidden" name = "messageid" value="{{messageid}}"/>
                    <div class="col-auto">
                        <label for="content" class="form-label">Content</label>
                        <textarea class="form-control" id="content" name="content" rows="10" required></textarea>
                        <div class="invalid-feedback">
                            Please enter content
                        </div>  
                      </div>
                    
                    <div class = "col-auto">
                        <br>
                        <input class="btn btn-secondary" type="submit" name="reply" value="Reply"/>
                    </div>

                    <div class = "col-auto">
                        <br>
                        <input class="btn btn-secondary" type="submit" name="delete" value="Delete"/>
                    </div>
                    

                </div>
                
            </div>   
        
    </form>


{% endblock %}
