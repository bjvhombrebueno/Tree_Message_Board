<!DOCTYPE html>
<html>
	<head>
        <meta charset="utf-8" />
        <title>{% block title %}Login{% endblock %}</title>
        <!-- CSS only -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  </head>
	<!-- Shows the login page where the app asks the user for the credentials -->
	<body>
    <form action="{{ url_for('login') }}" method="post">
		<div class="login">
			<br>
			<br>
      <h2 class="text-center" >Welcome to Trees a Crowd</h2>
      <h4 class="text-center">{{ msg }}</h4>
				<div class="container text-center">
					<div class = "row justify-content-center">
						<div class="col-auto">
              <br>
							<!-- <img src="/tree_message_board/static/images/trees.png" alt="Tree icon" width="128" height="128"> -->
              
              <div class="form-floating" novalidate>
                <input type="text" name = "username" class="form-control" id="floatingInput"  placeholder="Username" required>
                <label for="floatingInput">Username</label>
                <div class="invalid-feedback">
                  Please enter valid username
                </div>  
              </div>
              
              <div class="form-floating">
                <input type="password" name="password" class="form-control" id="floatingPassword" placeholder="Password" required>
                <label for="floatingPassword">Password</label>
                <div class="invalid-feedback">
                  Please enter valid password
                </div>  
              </div>
              <br>
              <button class="btn btn-secondary" type="submit">Sign in</button>
              
              <hr class="my-4">
        
              <a href="{{ url_for('register') }}" type="button" class="btn btn-secondary mb-3" >Register</a>
        
              <br>
              <br>
              <br>
              <p class="text-center">Ben Hombrebueno 1161713</p>
				  </div>
    </form>
       
	  </div>
	
		<br>
          <section class="content">
            <header>
              {% block header %}{% endblock %}
            </header>
            {% for message in get_flashed_messages() %}
              <div class="flash">{{ message }}</div>
            {% endfor %}
            {% block content %}{% endblock %}
          </section>
        <!-- JavaScript Bundle with Popper -->
       <script> 
        // Example starter JavaScript for disabling form submissions if there are invalid fields
        (() => {
          'use strict'
        
          // Fetch all the forms we want to apply custom Bootstrap validation styles to
          const forms = document.querySelectorAll('.needs-validation')
        
          // Loop over them and prevent submission
          Array.from(forms).forEach(form => {
            form.addEventListener('submit', event => {
              if (!form.checkValidity()) {
                event.preventDefault()
                event.stopPropagation()
              }
        
              form.classList.add('was-validated')
            }, false)
          })
        })()
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    </body>
</html>
