{% extends "layout.html" %}

{% block content %}
<!-- Gets the content of the reply -->

    <form action="/create_post" method="POST" class="row needs-validation">
        <div class="container text-center">
            <div class = "row justify-content-center">
                <h2 class="text-center text-white">Create Reply to Post</h2>
                <br>
                <div class="col-auto">
                    <label for="content" class="form-label text-white">Content</label>
                    <textarea class="form-control" id="content" name="content" rows="10" required></textarea>
                    <div class="invalid-feedback">
                        Please enter content
                    </div>  
                </div>
                <div class = "col-auto">
                    <br>
                    <input class="btn btn-secondary" type="submit"/>
                </div>
            </div>
        </div>   
    </form>

{% endblock %}
