{% extends 'layout.html' %}

{% block title %}Change Image{% endblock %}

{% block content %}

<form action="{{url_for('image')}}" method="post" autocomplete="off" enctype="multipart/form-data" >
	<div class="container text-center">
		<div class = "row justify-content-center">
			<div class="col-auto">
				<label for="username" class="form-label">Username: </label><br>
				<input type="text" class="form-control" name="username" {% if account %} value="{{account['username']}}" {% endif %} readonly />
				<div class="invalid-feedback">
					Please enter valid username
				</div>  
				<label for="image" class="form-label"> Image Path: </label><br>
				<!-- the image should be inside the static folder and the user must type the only the filename in the text box -->
				<input type="text" class="form-control" name="image" required  />
				<div class = "col-auto">
					<br>
					<input class="btn btn-secondary" type="submit" name="Update password"/>
				</div>
			</div>
		</div>
	</div>
</form>
{% endblock %}
