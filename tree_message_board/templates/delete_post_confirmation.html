{% extends "layout.html" %}

{% block content %}
<!-- Asks for post deletion confirmation -->
<form action='/delete_post_confirmation/{{messagedata['message_id']}}' method="POST" class="row needs-validation">
    <div class="container text-center">
        <div class = "row justify-content-center">
            <div class="col-auto">
                <h2 class="text-center">Delete Post</h2>
                <h5 class="text-center">Delete this post?</h5>
                <p class="text-center">{{messagedata['title']}}</p>
                <p class="text-center">{{messagedata['created_at']}}</p>
                <h6 class="fst-italic">{{username}}</p>
                <h6 class="fst-italic">{{messagedata['created_at']}}</p>
                <br>
                <input class="btn btn-secondary" type="submit" value="Delete"/>
            </div>
        </div>
    </div>
</form>

{% endblock %}
