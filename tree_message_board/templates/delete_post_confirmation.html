{% extends "layout.html" %}

{% block content %}
<!-- Asks for post deletion confirmation -->
<form action='/delete_post_confirmation/{{messagedata['message_id']}}' method="POST" class="row needs-validation">
    <div class="container text-center">
        <div class = "row justify-content-center">
            <h2 class="text-center text-white">Delete Post</h2>
            <br>
            <br>
            <div class="col-auto">
                <h5 class="text-center text-white">Delete this post?</h5>
                <p class="text-center text-white">{{messagedata['title']}}</p>
                <p class="text-center text-white">{{messagedata['username']}}</p>
                <p class="text-center text-white">{{messagedata['created_at']}}</p>
                <p class="text-center text-white">{{messagedata['content']}}</p>
                
                
                <br>
                <input class="btn btn-secondary" type="submit" value="Delete"/>
            </div>
        </div>
    </div>
</form>

{% endblock %}
