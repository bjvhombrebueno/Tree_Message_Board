<!DOCTYPE html>
	<html>
		
		<head>
			<meta charset="utf-8" />
			<title>{% block title %}Register{% endblock %}</title>
			<!-- CSS only -->
			<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
			
		</head>

	<body>
		<div class="register">
			<h1 class="text-center">Register</h1>
						
			<form action="{{ url_for('register') }}" method="post" autocomplete="off">
				<!-- Gets the user's data for registration -->
				<h4 class="text-center">{{ msg }}</h4>
				<div class="container text-center">
					<div class = "row justify-content-center">
						<div class="col-auto">
							<label for="username" class="form-label">Username: </label><br>
							<input type="text" class="form-control" name="username"  pattern= "(^[a-zA-Z][a-zA-Z\s]{0,20}[a-zA-Z]$)" required />
							<div class="invalid-feedback">
								Please enter valid username
							</div>  
						
							<label for="password" class="form-label">Password: </label><br>
							<input type="text" class="form-control" name="password"  pattern = "^(?=.*?[A-Z])(?=.*?[a-z])(?=.*?[0-9])(?=.*?[^A-Za-z0-9]).{8,}$" required />
							<div class="invalid-feedback">
								Please enter valid password
							</div>

							<label for="repassword" class="form-label">Re-enter Password: </label><br>
							<input type="text" class="form-control" name="repassword"  pattern= "^(?=.*?[A-Z])(?=.*?[a-z])(?=.*?[0-9])(?=.*?[^A-Za-z0-9]).{8,}$" required />
							<div class="invalid-feedback">
								Please enter valid password
							</div>  
						
							<label for="email" class="form-label">Email Address: </label><br>
							<input name="email" type="email" id="typeEmail" class="form-control"  pattern="^[a-zA-Z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,4}$" required/>
							<div class="invalid-feedback">
							Please enter valid email address
							</div>  
						
							<label for="firstname" class="form-label">First name: </label><br>
							<input type="text" class="form-control" name="firstname"  pattern= "(^[a-zA-Z][a-zA-Z\s]{0,50}[a-zA-Z]$)" required />
							<div class="invalid-feedback">
								Please enter valid first name
							</div>  
						
							<label for="lastname" class="form-label">Last name: </label><br>
							<input type="text" class="form-control" name="lastname"  pattern="(^[a-zA-Z][a-zA-Z\s]{0,50}[a-zA-Z]$)" required />
							<div class="invalid-feedback">
								Please enter valid last name
							</div>  
						
							<label for="birthdate" class="form-label">Birthdate: </label><br>
							<input name="birthdate" type="date" class="form-control" required/>
							<div class="invalid-feedback">
							Please enter valid date
							</div>  
						
							<label for="location" class="form-label">Location: </label><br>
							<input type="text" class="form-control" name="location"  pattern="(^[a-zA-Z][a-zA-Z\s]{0,50}[a-zA-Z]$)" required />
							<div class="invalid-feedback">
								Please enter valid location name
							</div>  
						
							<br>
							<input class="btn btn-secondary" type="submit" value="Register"/>
							<hr>
							<a href="{{url_for('login')}}" type="button" class="btn btn-secondary">Login</a>
						</div>
					</div>
					
				</div>
			</form>
		</div>

		<!-- JavaScript Bundle with Popper -->
		<script> 
			// Example starter JavaScript for disabling form submissions if there are invalid fields
			(() => {
			  'use strict'
			
			  // Fetch all the forms we want to apply custom Bootstrap validation styles to
			  const forms = document.querySelectorAll('.needs-validation')
			
			  // Loop over them and prevent submission
			  Array.from(forms).forEach(form => {
				form.addEventListener('submit', event => {
				  if (!form.checkValidity()) {
					event.preventDefault()
					event.stopPropagation()
				  }
			
				  form.classList.add('was-validated')
				}, false)
			  })
			})()
	</script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
	</body>
</html>
