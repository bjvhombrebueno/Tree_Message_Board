    <div class="container text-center">
        <div class = "row justify-content-center">
            <table class="table table-hover table-sm">
                <thead>
                    <tr>
                        <div class = "col-auto">
                            <th>Family Name</th>
                        </div>
                        <div class = "col-auto">
                            <th>First Name</th>
                        </div>
                        <div class = "col-auto">
                            <th>Email Address</th>
                        </div>
                        <div class = "col-auto">
                            <th>Phone Number</th>
                        </div>
                        <div class = "col-auto">
                            <th>Make a booking</th>
                        </div>
                        <div class = "col-auto">
                            <th>Go to Customer Home Page</th>
                        </div>
                    </tr>
                </thead>
                {% for user in userlist %}
                    <tr> 
                        <div class = "col-auto">
                            <td>{{user['username']}}</td>
                        </div>
                        <div class = "col-auto">
                          <td>{{user['email']}}</td>
                        </div>
                        <div class = "col-auto">
                          <td>{{user['first_name']}}</td>
                        </div>
                        <div class = "col-auto">
                          <td>{{user['last_name']}}</td>
                        </div>
                        <div class = "col-auto">
                          <td><a href="/access/role/{{user['user_id']}}" type="button" class="btn btn-secondary">Change Role</a></td>
							
						</div>
						<div class = "col-auto">
							<td><a href="/access/status/{{user['user_id']}}" type="button" class="btn btn-secondary">Change Status</a></td>
						</div>
                    </tr>
                {% endfor %}
            </table>
        </div>
